<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Project Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-alt: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,.15);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,.15);
    --purple: #bc8cff;
    --purple-dim: rgba(188,140,255,.15);
    --danger: #f85149;
    --danger-dim: rgba(248,81,73,.12);
    --yellow: #d29922;
    --yellow-dim: rgba(210,153,34,.15);
    --teal: #2dd4bf;
    --teal-dim: rgba(45,212,191,.15);
    --radius: 8px;
    --radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:grid;grid-template-columns:320px 1fr;overflow:hidden}

/* ======== SIDEBAR ======== */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:1.15rem;font-weight:600;display:flex;align-items:center;gap:10px}
.sidebar-header h1 span{font-size:1.3rem}
.lang-toggle{display:flex;gap:0;margin-top:10px}
.lang-btn{flex:1;padding:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .12s}
.lang-btn:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.lang-btn:last-child{border-radius:0 var(--radius) var(--radius) 0}
.lang-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sidebar-list{flex:1;overflow-y:auto;padding:8px}
.sidebar-item{padding:10px 14px;border-radius:var(--radius);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .12s}
.sidebar-item:hover{background:rgba(255,255,255,.04)}
.sidebar-item.active{background:var(--accent-dim);color:var(--accent)}
.sidebar-item .name{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sidebar-item .date{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sidebar-empty{padding:24px;text-align:center;color:var(--muted);font-size:.9rem}
.btn-new{margin:12px;padding:10px;border-radius:var(--radius);border:1px dashed var(--border);background:transparent;color:var(--accent);font-weight:600;cursor:pointer;font-size:.9rem;transition:background .12s,border-color .12s}
.btn-new:hover{background:var(--accent-dim);border-color:var(--accent)}

/* ======== CREATE STUB (sticky collapsed strip) ======== */
.create-stub{position:sticky;top:0;z-index:200;display:none;align-items:center;gap:8px;padding:7px 20px;background:var(--surface);border-bottom:2px solid var(--accent);cursor:pointer;font-size:.85rem;font-weight:600;color:var(--accent);transition:background .15s;user-select:none}
.create-stub:hover{background:var(--accent-dim)}
.create-stub .stub-arrow{margin-left:auto;font-size:.75rem;opacity:.7}
.create-stub.visible{display:flex}

/* ======== MAIN ======== */
.main{height:100vh;overflow-y:auto;display:flex;flex-direction:column}

/* -- Create form -- */
.create-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:28px 32px;display:none;flex-direction:column;gap:18px}
.create-panel.active{display:flex}
.create-panel h2{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field label{font-size:.8rem;font-weight:500;color:var(--muted)}
.form-field input,.form-field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius);font:inherit;font-size:.9rem;transition:border-color .15s}
.form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--accent)}
.form-field textarea{resize:vertical;min-height:90px}
.form-field .form-error{color:var(--danger);font-size:.78rem;margin-top:2px;display:none}
.form-field.has-error input,.form-field.has-error textarea{border-color:var(--danger)}
.form-field.has-error .form-error{display:block}
.form-actions{display:flex;gap:10px;justify-content:flex-end}

/* -- Detail view -- */
.detail-panel{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem;text-align:center}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
.detail-header h2{font-size:1.3rem;font-weight:600}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:500;border:1px solid var(--border);color:var(--muted)}

/* -- Tabs -- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:10px 20px;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:color .12s,border-color .12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}

/* -- Accordion -- */
.accordion{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;border-left-width:3px;border-left-style:solid;border-left-color:var(--theme-clr,var(--border));transition:box-shadow .2s,border-color .2s}
.accordion:hover{box-shadow:0 4px 20px rgba(0,0,0,.25)}

/* 5 color themes — cycling */
.accordion[data-theme="1"]{--theme-clr:var(--accent);--theme-bg:rgba(88,166,255,.06);--theme-dim:rgba(88,166,255,.18)}
.accordion[data-theme="2"]{--theme-clr:var(--green);--theme-bg:rgba(63,185,80,.06);--theme-dim:rgba(63,185,80,.18)}
.accordion[data-theme="3"]{--theme-clr:var(--purple);--theme-bg:rgba(188,140,255,.06);--theme-dim:rgba(188,140,255,.18)}
.accordion[data-theme="4"]{--theme-clr:var(--yellow);--theme-bg:rgba(210,153,34,.06);--theme-dim:rgba(210,153,34,.18)}
.accordion[data-theme="5"]{--theme-clr:var(--teal);--theme-bg:rgba(45,212,191,.06);--theme-dim:rgba(45,212,191,.18)}
.accordion[data-theme]{border-left-color:var(--theme-clr)}

.acc-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--theme-bg,var(--surface-alt));cursor:pointer;user-select:none;gap:12px;transition:background .15s}
.acc-header:hover{background:var(--theme-dim,rgba(255,255,255,.03))}

/* Number badge */
.acc-num{width:26px;height:26px;border-radius:50%;background:var(--theme-clr,var(--muted));color:#0d1117;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 3px rgba(0,0,0,.3)}

/* Title block */
.acc-title-wrap{display:flex;flex-direction:column;flex:1;min-width:0}
.acc-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--theme-clr,var(--muted));margin-bottom:2px}
.acc-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-chips{display:flex;gap:6px;flex-wrap:wrap}
.acc-chip{padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:500}
.acc-chip.pri-high{background:var(--danger-dim);color:var(--danger)}
.acc-chip.pri-medium{background:var(--yellow-dim);color:var(--yellow)}
.acc-chip.pri-low{background:var(--green-dim);color:var(--green)}
.acc-chip.component{background:var(--purple-dim);color:var(--purple)}
.acc-chip.estimate{background:var(--accent-dim);color:var(--accent)}
.acc-chip.date{background:rgba(255,255,255,.06);color:var(--muted)}
.acc-chip.points{background:var(--green-dim);color:var(--green);font-weight:700}
.acc-arrow{color:var(--muted);transition:transform .2s}
/* === Ripple — needs overflow:hidden on header === */
.acc-header{overflow:hidden}
.acc-ripple{position:absolute;border-radius:50%;background:var(--theme-clr,var(--accent));opacity:0;pointer-events:none;transform:scale(0)}
/* === Typewriter cursor === */
@keyframes twCursor{50%{opacity:0}}
/* === Vertical timeline line === */
.acc-timeline-wrap{position:relative}
.acc-vline{position:absolute;left:28px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),var(--green),var(--purple),var(--yellow),var(--teal));transform-origin:top center;transform:scaleY(0);border-radius:2px;opacity:.35;z-index:0;pointer-events:none}
/* === Floating mini-map === */
.acc-minimap{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:999;display:flex;flex-direction:column;gap:10px;padding:10px 8px;background:rgba(13,17,23,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.minimap-dot{width:9px;height:9px;border-radius:50%;background:var(--border);cursor:pointer;border:none;padding:0;transition:background .2s,transform .2s,box-shadow .2s;position:relative;display:block;outline:none}
.minimap-dot.active{background:var(--dot-clr,var(--accent));transform:scale(1.5);box-shadow:0 0 8px var(--dot-clr,var(--accent))}
.minimap-dot .dot-tooltip{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.73rem;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1000}
.minimap-dot:hover .dot-tooltip{opacity:1}
.acc-body{display:none;padding:14px 16px;border-top:1px solid var(--border);background:var(--bg);font-size:.9rem;line-height:1.6;color:var(--muted)}
.acc-body.open{display:block}
.acc-body p{margin-bottom:8px}
.acc-body .sub-title{font-weight:600;color:var(--text);margin-top:12px;margin-bottom:4px;font-size:.85rem}
.acc-body ul{padding-left:18px;margin-bottom:8px}
.acc-body li{margin-bottom:4px}

/* nested cards for stories/subtasks */
.nested-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:6px;margin-bottom:6px}
.nested-card strong{font-size:.88rem;color:var(--text)}
.nested-card .desc{color:var(--muted);font-size:.85rem;margin-top:4px}
.nested-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* -- Buttons -- */
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;font-size:.85rem;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-alt);border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#4090e8}
.btn-danger{border-color:rgba(248,81,73,.4);color:var(--danger)}
.btn-danger:hover{background:var(--danger-dim)}
.btn-success{border-color:rgba(63,185,80,.4);color:var(--green)}
.btn-success:hover{background:var(--green-dim)}
.btn-sm{padding:4px 10px;font-size:.78rem}

/* -- Toast -- */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:.88rem;font-weight:500;color:#fff;animation:toastIn .3s ease;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.success{background:#238636}
.toast.error{background:#da3633}
.toast.info{background:#1f6feb}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* -- Loading bar -- */
.loading-bar{height:3px;background:var(--accent);position:fixed;top:0;left:0;z-index:9999;width:0;transition:width .3s;border-radius:0 2px 2px 0}
.loading-bar.active{animation:loadPulse 2s ease-in-out infinite}
@keyframes loadPulse{0%{width:10%}50%{width:70%}100%{width:90%}}

/* -- Loading overlay -- */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:9998;display:flex;align-items:center;justify-content:center}
.loading-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;max-width:420px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.loading-box h3{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.loading-box .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box .log-list{text-align:left;max-height:200px;overflow-y:auto;font-size:.82rem;color:var(--muted);margin-top:10px}
.loading-box .log-item{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.loading-box .log-item.ok{color:var(--green)}
.loading-box .log-item.err{color:var(--danger)}

/* -- XML editor -- */
.xml-editor{margin-top:16px}
.xml-editor textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:var(--radius);font-family:"JetBrains Mono",Consolas,monospace;font-size:.82rem;line-height:1.5;resize:vertical}
.xml-editor textarea:focus{outline:none;border-color:var(--accent)}

/* ======== DASHBOARD V2 ======== */
@keyframes barGrow{from{width:0}to{width:var(--bar-w)}}

/* scroll-reveal animation (replaces CSS dashFadeUp — driven by IntersectionObserver) */
@keyframes revealUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes revealScale{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1)}
.reveal.in-view{opacity:1;transform:translateY(0)}
.reveal-scale{opacity:0;transform:scale(.94);transition:opacity .5s ease,transform .5s ease}
.reveal-scale.in-view{opacity:1;transform:scale(1)}

.dv2{display:flex;flex-direction:column;gap:20px}
.dv2-row{display:grid;gap:16px}
.dv2-row.c6{grid-template-columns:repeat(6,1fr)}.dv2-row.c4{grid-template-columns:repeat(4,1fr)}.dv2-row.c3{grid-template-columns:repeat(3,1fr)}.dv2-row.c2{grid-template-columns:1fr 1fr}.dv2-row.c1{grid-template-columns:1fr}
@media(max-width:1100px){.dv2-row.c6{grid-template-columns:repeat(3,1fr)}.dv2-row.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.dv2-row.c6,.dv2-row.c4,.dv2-row.c3,.dv2-row.c2{grid-template-columns:1fr}}

/* stat cards */
.sv2{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 14px;text-align:center;position:relative;overflow:hidden;transition:transform .2s,border-color .25s,box-shadow .25s;cursor:default}
.sv2:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.sv2::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0;background:var(--stripe,var(--accent));opacity:.8}
.sv2 .si{font-size:1.3rem;margin-bottom:4px;filter:grayscale(.2)}
.sv2 .sn{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--clr,var(--accent))}
.sv2 .sl{font-size:.74rem;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}

/* panels - base */
.dp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;position:relative;overflow:visible;transition:box-shadow .25s,border-color .25s}
.dp::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:linear-gradient(90deg,var(--g1,var(--accent)),var(--g2,var(--purple)));opacity:.7}
.dp:hover{box-shadow:0 8px 32px rgba(0,0,0,.28)}
.dp h3{font-size:.95rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.dp h3 .badge{font-size:.72rem;padding:2px 9px;border-radius:999px;font-weight:600}
.dp h3 .badge.blue{background:var(--accent-dim);color:var(--accent)}
.dp h3 .badge.green{background:var(--green-dim);color:var(--green)}
.dp h3 .badge.purple{background:var(--purple-dim);color:var(--purple)}

/* PRINCE2 panel – subtle blue tint */
.dp-p2{background:linear-gradient(145deg,rgba(88,166,255,.07) 0%,var(--surface) 55%);border-color:rgba(88,166,255,.28)}
.dp-p2:hover{border-color:rgba(88,166,255,.55);box-shadow:0 8px 32px rgba(88,166,255,.12)}
.dp-p2::after{background:linear-gradient(90deg,var(--accent),#79b8ff);opacity:.85}

/* Scrum panel – subtle green tint */
.dp-sc{background:linear-gradient(145deg,rgba(63,185,80,.07) 0%,var(--surface) 55%);border-color:rgba(63,185,80,.28)}
.dp-sc:hover{border-color:rgba(63,185,80,.55);box-shadow:0 8px 32px rgba(63,185,80,.12)}
.dp-sc::after{background:linear-gradient(90deg,var(--green),#56d364);opacity:.85}

/* Risk panel – subtle yellow tint */
.dp-risk{background:linear-gradient(145deg,rgba(210,153,34,.07) 0%,var(--surface) 55%);border-color:rgba(210,153,34,.22)}
.dp-risk:hover{border-color:rgba(210,153,34,.5);box-shadow:0 8px 32px rgba(210,153,34,.1)}
.dp-risk::after{background:linear-gradient(90deg,var(--yellow),var(--danger));opacity:.8}

/* donut chart */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.donut-legend-item strong{color:var(--text)}
.donut-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* timeline */
.tl-track{position:relative;display:flex;gap:0;padding:20px 0 4px}
.tl-line{position:absolute;top:26px;left:7%;right:7%;height:2px;background:var(--border);z-index:0}
.tl-node:hover{transform:translateY(-3px)}
.tl-dot{width:16px;height:16px;border-radius:50%;margin:0 auto 8px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--dot-c,var(--accent));background:var(--dot-c,var(--accent));transition:box-shadow .2s}
.tl-node:hover .tl-dot{box-shadow:0 0 0 4px var(--dot-c,var(--accent))}
.tl-name{font-size:.75rem;font-weight:600;color:var(--text);white-space:normal;word-break:break-word;overflow-wrap:break-word;line-height:1.35;padding:0 2px}
.tl-node{flex:1;text-align:center;position:relative;z-index:1;cursor:pointer;transition:transform .18s;padding-bottom:10px}
.tl-date{font-size:.68rem;color:var(--muted);margin-top:2px}
.tl-est{font-size:.66rem;color:var(--accent);margin-top:1px}

/* bar chart v2 */
.bv2-wrap{display:flex;flex-direction:column;gap:12px}
.bv2{display:grid;grid-template-columns:70px 1fr 52px;align-items:center;gap:10px}
.bv2-lbl{font-size:.8rem;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bv2-track{height:26px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative}
.bv2-fill{height:100%;border-radius:6px;position:relative;width:0;animation:barGrow .8s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--del,.3s)}
.bv2-fill.gradient-green{background:linear-gradient(90deg,var(--green),#56d364)}
.bv2-fill.gradient-blue{background:linear-gradient(90deg,var(--accent),#79b8ff)}
.bv2-fill.gradient-purple{background:linear-gradient(90deg,var(--purple),#d2a8ff)}
.bv2-val{font-size:.8rem;font-weight:600;color:var(--text)}

/* radar chart */
.radar-wrap{display:flex;justify-content:center;padding:10px 0}

/* comparison table */
.cmp2{width:100%;border-collapse:separate;border-spacing:0;font-size:.84rem;overflow:hidden;border-radius:var(--radius)}
.cmp2 th,.cmp2 td{padding:10px 14px;border-bottom:1px solid var(--border)}
.cmp2 thead th{background:var(--surface-alt);color:var(--text);font-weight:600;text-align:left}
.cmp2 thead th:not(:first-child){text-align:center}
.cmp2 td{color:var(--muted)}
.cmp2 td:not(:first-child){text-align:center;font-weight:600;color:var(--text)}
.cmp2 tbody tr{transition:background .12s}
.cmp2 tbody tr:hover{background:rgba(255,255,255,.02)}
.cmp2 tbody tr:last-child td{border-bottom:none}
.cmp2 tr.cmp-sep td{background:var(--bg);font-weight:600;letter-spacing:.03em;border-top:1px solid var(--border);padding-top:8px!important}

/* risk blocks */
.risk-blocks{display:flex;gap:10px}
.risk-blk{flex:1;border-radius:var(--radius);padding:14px;text-align:center;border:1px solid rgba(255,255,255,.05);transition:transform .15s}
.risk-blk:hover{transform:scale(1.04)}
.risk-blk .rv{font-size:1.5rem;font-weight:700;line-height:1.1}
.risk-blk .rl{font-size:.72rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.3px}

/* mini stat pills */
.mini-stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mini-stat{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:999px;font-size:.78rem}
.mini-stat .ms-label{color:var(--muted)}.mini-stat .ms-val{font-weight:700}

/* tooltip */
.dv2-tip{position:fixed;z-index:10001;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:.8rem;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.45);line-height:1.4}
.dv2-tip.show{opacity:1}

/* no data */
.dv2-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.dv2-empty .dv2-empty-icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.dv2-empty p{font-size:.9rem}

/* ======== INLINE EDIT ======== */
.edit-input,.edit-textarea,.edit-select{background:var(--bg);border:1px solid var(--accent);color:var(--text);padding:4px 8px;border-radius:4px;font:inherit;font-size:.85rem;width:100%}
.edit-textarea{min-height:50px;resize:vertical}
.edit-select{padding:4px 6px}
.edit-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.edit-row label{font-size:.78rem;color:var(--muted);min-width:70px}
.edit-row input,.edit-row select{flex:1}
.btn-icon{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:2px 6px;border-radius:4px;transition:all .12s}
.btn-icon:hover{background:rgba(255,255,255,.08);color:var(--text)}
.btn-icon.danger:hover{color:var(--danger);background:var(--danger-dim)}
.edit-bar{display:flex;gap:8px;margin-bottom:12px;padding:10px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);align-items:center}

/* ======== VALIDATION MODAL ======== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:10000;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:12px;color:var(--danger)}
.modal ul{padding-left:18px;margin-bottom:16px}
.modal li{color:var(--muted);font-size:.88rem;margin-bottom:4px}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end}

@media(max-width:768px){body{grid-template-columns:1fr}.sidebar{display:none}}
</style>

function t(key) { return (i18n[state.lang] || i18n.sk)[key] || key; }
function tf(key, ...args) { let s = t(key); args.forEach((a,i) => s = s.replace('{'+i+'}', a)); return s; }

        state.lang = btn.dataset.lang;
        localStorage.setItem('lang', state.lang);
        applyLang();
        if (state.activeId) renderDetail(state.activeId);
    });
});

loadProjects();
setupCreatePanelSticky();

function applyLang() {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));

    renderSidebar();
}

// ========================= TOAST =========================
function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

// ========================= LOADING =========================
function setLoading(flag) {
    document.getElementById('loadingBar').classList.toggle('active', flag);
}

// ========================= CREATE =========================
function toggleCreate(show) {
    document.getElementById('createPanel').classList.toggle('active', show);
    document.getElementById('createStub').classList.remove('visible');
    if (show) {
        setTimeout(() => document.getElementById('projectName').focus(), 50);
    }
}

function collapseCreatePanel() {
    document.getElementById('createPanel').classList.remove('active');
    document.getElementById('createStub').classList.add('visible');
}

function setupCreatePanelSticky() {
    document.getElementById('createStub').addEventListener('click', function() {
        document.getElementById('createPanel').classList.add('active');
        document.getElementById('createStub').classList.remove('visible');
        setTimeout(() => document.getElementById('projectName').focus(), 50);
    });
}

// ========================= VALIDATION =========================
function clearFormErrors() {
    document.querySelectorAll('.form-field').forEach(f => f.classList.remove('has-error'));
}

function setFieldError(fieldId, errId, msg) {
    document.getElementById(fieldId).classList.add('has-error');
    document.getElementById(errId).textContent = msg;
}

function validateForm() {
    clearFormErrors();
    let ok = true;
    const name = document.getElementById('projectName').value.trim();
    const desc = document.getElementById('projectDescription').value.trim();
    const start = document.getElementById('startDate').value;
    const dl = document.getElementById('deadline').value;
    if (!name || name.length < 3) { setFieldError('ff-name','err-name',t('errNameReq')); ok = false; }
    if (!desc || desc.length < 10) { setFieldError('ff-desc','err-desc',t('errDescReq')); ok = false; }
    if (start && dl && dl < start) { setFieldError('ff-deadline','err-deadline',t('errDateOrder')); ok = false; }
    return ok;
}

function validateXmlForExport(xmlContent, methodology) {
    const parsed = parseXml(xmlContent);
    const errors = [];
    if (methodology === 'PRINCE2') {
        if (!parsed.prince2) { errors.push(t('valNoPrince')); return errors; }
        const stages = Array.from(parsed.prince2.querySelectorAll('Stages > Stage'));
        if (!stages.length) errors.push(t('valNoStages'));
        stages.forEach((s,i) => { if(!txt(s,'Name')) errors.push(tf('valStageName',i+1)); });
    } else {
        if (!parsed.scrum) { errors.push(t('valNoScrum')); return errors; }
        const sprints = Array.from(parsed.scrum.querySelectorAll('Sprints > Sprint'));
        if (!sprints.length) errors.push(t('valNoSprints'));
        sprints.forEach((sp,si) => {
            if(!txt(sp,'Name')) errors.push(tf('valSprintName',si+1));
            const epics = Array.from(sp.querySelectorAll('Epics > Epic'));
            if(!epics.length) errors.push(tf('valNoEpics',si+1));
            epics.forEach((ep,ei) => {
                if(!txt(ep,'Title')) errors.push(tf('valEpicName',ei+1,si+1));
                const stories = Array.from(ep.querySelectorAll('Stories > Story'));
                if(!stories.length) errors.push(tf('valNoStories',ei+1,si+1));
            });
        });
    }
    return errors;
}

function showValidationModal(errors, onProceed) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal">
        <h3>${esc(t('valTitle'))}</h3>
        <ul>${errors.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul>
        <div class="modal-actions">
            <button class="btn" id="valClose">${esc(t('valClose'))}</button>
            <button class="btn btn-danger" id="valProceed">${esc(t('valProceed'))}</button>
        </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#valClose').onclick = () => overlay.remove();
    overlay.querySelector('#valProceed').onclick = () => { overlay.remove(); onProceed(); };
}

// ========================= LOADING OVERLAY =========================
function showLoadingOverlay(title, subtitle) {
    removeLoadingOverlay();
    const el = document.createElement('div');
    el.className = 'loading-overlay';
    el.id = 'loadingOverlay';
    el.innerHTML = `<div class="loading-box"><div class="spinner"></div><h3>${esc(title)}</h3><p style="color:var(--muted);font-size:.88rem">${esc(subtitle||'')}</p><div class="log-list" id="loadingLogs"></div></div>`;
    document.body.appendChild(el);
}
function addLoadingLog(msg, cls) {
    const list = document.getElementById('loadingLogs');
    if (!list) return;
    const item = document.createElement('div');
    item.className = 'log-item '+(cls||'');
    item.textContent = msg;
    list.appendChild(item);
    list.scrollTop = list.scrollHeight;
}
function removeLoadingOverlay() {
    const el = document.getElementById('loadingOverlay');
    if (el) el.remove();
}

// ========================= SUBMIT =========================
async function onSubmit(e) {
    e.preventDefault();
    if (!validateForm()) return;
    const name = document.getElementById('projectName').value.trim();
    const description = document.getElementById('projectDescription').value.trim();
    const startDate = document.getElementById('startDate').value || '';
    const deadline = document.getElementById('deadline').value || '';
    setLoading(true);
    showLoadingOverlay(
        state.lang==='sk' ? 'Generovanie plánu...' : 'Generating plan...',
        state.lang==='sk' ? 'AI generuje PRINCE2 a Scrum plány. Môže to trvať 30-60 sekúnd.' : 'AI is generating PRINCE2 and Scrum plans. This may take 30-60 seconds.'
    );
    try {
        const r = await fetch('/api/generate', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name, description, startDate, deadline, lang: state.lang})
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
        toggleCreate(false);
        e.target.reset();
        clearFormErrors();
        await loadProjects();
        if (data.xml) {
            toast(t('planGenerated'), 'success');
            if (state.projects.length) selectProject(state.projects[0].id);
        } else {
            toast(t('aiNoResponse'), 'error');
        }
    } catch (err) {
        console.error(err);
        toast(t('genError') + ': ' + err.message, 'error');
    } finally {
        setLoading(false);
        removeLoadingOverlay();
    }
}

// ========================= PROJECTS =========================
async function loadProjects() {
    try {
        const r = await fetch('/api/projects');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        state.projects = await r.json();
        renderSidebar();
        if (state.activeId) renderDetail(state.activeId);
    } catch (err) { console.error(err); }
}

function renderSidebar() {
    const el = document.getElementById('sidebarList');
    if (!state.projects.length) { el.innerHTML = '<div class="sidebar-empty">'+t('noProjects')+'</div>'; return; }
    el.innerHTML = state.projects.map(p => `
        <div class="sidebar-item ${p.id===state.activeId?'active':''}" data-id="${p.id}">
            <span class="name">${esc(p.name)}</span><span class="date">#${p.id}</span>
        </div>`).join('');
    el.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', () => selectProject(+item.dataset.id));
    });
}

function selectProject(id) {
    state.activeId = id;
    state.editMode = false;
    state.xmlDoc = null;
    state.activeTab = 'dashboard';
    clearMinimap();
    renderSidebar();
    renderDetail(id);
}

// ========================= DASHBOARD =========================
function parseEstimate(s) {
    if (!s) return 0;
    let h = 0;
    const wm = s.match(/(\d+)\s*w/); if (wm) h += +wm[1] * 40;
    const dm = s.match(/(\d+)\s*d/); if (dm) h += +dm[1] * 8;
    const hm = s.match(/(\d+)\s*h/); if (hm) h += +hm[1];
    return h;
}
function fmtHours(h) {
    if (!h) return '0h';
    const w = Math.floor(h/40), rem = h%40, d = Math.floor(rem/8), hr = rem%8;
    let s = '';
    if (w) s += w+'w ';
    if (d) s += d+'d ';
    if (hr) s += hr+'h';
    return s.trim() || '0h';
}

function renderDashboard(parsed) {
    // ---- Scrum stats ----
    let sSprints=0,sEpics=0,sStories=0,sSubtasks=0,sPoints=0,sHours=0,sHighPri=0,sMedPri=0,sLowPri=0,sRisks=0;
    const sprintData=[];
    if(parsed.scrum){
        const sprints=Array.from(parsed.scrum.querySelectorAll('Sprints > Sprint'));
        sSprints=sprints.length;
        sprints.forEach(sp=>{
            let spSt=0,spPt=0,spH=0;
            sRisks+=Array.from(sp.querySelectorAll('Risks > Risk')).length;
            const epics=Array.from(sp.querySelectorAll('Epics > Epic'));
            sEpics+=epics.length;
            epics.forEach(ep=>{
                const stories=Array.from(ep.querySelectorAll('Stories > Story'));
                sStories+=stories.length; spSt+=stories.length;
                stories.forEach(st=>{
                    const pts=parseInt(txt(st,'StoryPoints'))||0; sPoints+=pts; spPt+=pts;
                    const est=parseEstimate(txt(st,'OriginalEstimate')); sHours+=est; spH+=est;
                    const pri=txt(st,'Priority');
                    if(pri==='High')sHighPri++; else if(pri==='Medium')sMedPri++; else sLowPri++;
                    sSubtasks+=st.querySelectorAll('SubTasks > Task').length;
                });
            });
            sprintData.push({name:txt(sp,'Name')||'Sprint '+(sprintData.length+1),stories:spSt,points:spPt,hours:spH});
        });
    }
    // ---- PRINCE2 stats ----
    // Priorities and time counted ONLY at Task level (= equivalent to Scrum Story level)
    // Stage estimates kept only for timeline display to avoid double-counting
    let pStages=0,pTasks=0,pOutputs=0,pRisks=0,pHours=0,pHighPri=0,pMedPri=0,pLowPri=0;
    const stageData=[];
    if(parsed.prince2){
        const stages=Array.from(parsed.prince2.querySelectorAll('Stages > Stage'));
        pStages=stages.length;
        stages.forEach(s=>{
            pOutputs+=Array.from(s.querySelectorAll('Outputs > Output')).length;
            pRisks+=Array.from(s.querySelectorAll('Risks > Risk')).length;
            // Stage estimate used only for stageData display, NOT summed into pHours
            const stagePri=txt(s,'Priority');
            const stageEst=txt(s,'OriginalEstimate');
            const tasks=Array.from(s.querySelectorAll('Tasks > Task'));
            pTasks+=tasks.length;
            // Count time and priority only at task level (same granularity as Scrum stories)
            if(tasks.length>0){
                tasks.forEach(tk=>{
                    pHours+=parseEstimate(txt(tk,'OriginalEstimate'));
                    const tp=txt(tk,'Priority');
                    if(tp==='High')pHighPri++; else if(tp==='Medium')pMedPri++; else pLowPri++;
                });
            } else {
                // No tasks: fall back to stage-level estimate and priority
                pHours+=parseEstimate(stageEst);
                if(stagePri==='High')pHighPri++; else if(stagePri==='Medium')pMedPri++; else pLowPri++;
            }
            stageData.push({name:txt(s,'Name')||'Stage '+(stageData.length+1),dueDate:txt(s,'DueDate'),estimate:stageEst,priority:stagePri});
        });
    }

    const hasP=!!parsed.prince2, hasS=!!parsed.scrum, hasBoth=hasP&&hasS;
    if(!hasP&&!hasS) return '<div class="dv2"><div class="dv2-empty"><div class="dv2-empty-icon">&#x1F4CA;</div><p>'+t('dNoData')+'</p></div></div>';

    const maxPts=Math.max(...sprintData.map(d=>d.points),1);
    const maxSt=Math.max(...sprintData.map(d=>d.stories),1);

    // store data for post-render animations
    window._dashData={
        p2Pri:[pHighPri,pMedPri,pLowPri], scPri:[sHighPri,sMedPri,sLowPri],
        radar: hasBoth ? buildRadarData(pStages,pTasks,pHours,pRisks,pHighPri,pMedPri,pLowPri,sSprints,sStories,sHours,sRisks,sHighPri,sMedPri,sLowPri) : null
    };

    let h='<div class="dv2" id="dashV2">';

    // ROW 2: methodology panels
    h+='<div class="dv2-row '+(hasBoth?'c2':'c1')+'">';
    if(hasP){
        h+='<div class="dp dp-p2">';
        h+='<h3>&#x1F3DB; PRINCE2 <span class="badge blue">'+pStages+' '+t('dStages').toLowerCase()+'</span></h3>';
        // donut
        h+='<div class="donut-wrap"><div id="donutP2" style="width:150px;height:150px"></div>';
        h+='<div class="donut-legend">';
        h+=dlItem('var(--danger)',t('dHigh'),pHighPri);
        h+=dlItem('var(--yellow)',t('dMedium'),pMedPri);
        h+=dlItem('var(--green)',t('dLow'),pLowPri);
        h+='</div></div>';
        // timeline
        h+='<h3 style="margin-top:20px;font-size:.86rem">&#x1F552; '+t('dPrince2Timeline')+'</h3>';
        h+='<div style="position:relative"><div class="tl-line"></div><div class="tl-track">';
        const dotColors=['var(--accent)','var(--green)','var(--purple)','var(--yellow)'];
        stageData.forEach((s,i)=>{
            h+='<div class="tl-node" data-tip="'+esc(s.name+(s.estimate?' | '+s.estimate:''))+'" style="--dot-c:'+dotColors[i%dotColors.length]+'">';
            h+='<div class="tl-dot"></div>';
            h+='<div class="tl-name">'+esc(s.name)+'</div>';
            if(s.dueDate)h+='<div class="tl-date">'+esc(s.dueDate)+'</div>';
            if(s.estimate)h+='<div class="tl-est">'+esc(s.estimate)+'</div>';
            h+='</div>';
        });
        h+='</div></div>';
        // mini stats
        h+='<div class="mini-stats">';
        h+=ms(t('dOutputs'),pOutputs,'var(--accent)');
        h+=ms(t('dTasks'),pTasks,'var(--accent)');
        h+=ms(t('dTime'),fmtHours(pHours),'var(--purple)');
        h+='</div>';
        h+='</div>';
    }
    if(hasS){
        h+='<div class="dp dp-sc">';
        h+='<h3>&#x1F3C3; Scrum <span class="badge green">'+sSprints+' '+t('dSprints').toLowerCase()+'</span></h3>';
        // donut
        h+='<div class="donut-wrap"><div id="donutSc" style="width:150px;height:150px"></div>';
        h+='<div class="donut-legend">';
        h+=dlItem('var(--danger)',t('dHigh'),sHighPri);
        h+=dlItem('var(--yellow)',t('dMedium'),sMedPri);
        h+=dlItem('var(--green)',t('dLow'),sLowPri);
        h+='</div></div>';
        // sprint velocity bars
        h+='<h3 style="margin-top:20px;font-size:.86rem">&#x1F680; '+t('dSprintVelocity')+'</h3>';
        h+='<div class="bv2-wrap">';
        sprintData.forEach((d,i)=>{
            const pctS=(d.stories/maxSt*100).toFixed(0);
            const pctP=(d.points/maxPts*100).toFixed(0);
            const del=(.2+i*.15).toFixed(2);
            h+='<div class="bv2"><span class="bv2-lbl">Sprint '+(i+1)+'</span>';
            h+='<div class="bv2-track"><div class="bv2-fill gradient-green" style="--bar-w:'+pctS+'%;--del:'+del+'s"></div></div>';
            h+='<span class="bv2-val">'+d.stories+' st</span></div>';
            h+='<div class="bv2"><span class="bv2-lbl"></span>';
            h+='<div class="bv2-track"><div class="bv2-fill gradient-blue" style="--bar-w:'+pctP+'%;--del:'+(.05+parseFloat(del)).toFixed(2)+'s"></div></div>';
            h+='<span class="bv2-val">'+d.points+' SP</span></div>';
        });
        h+='</div>';
        // mini stats
        h+='<div class="mini-stats">';
        h+=ms(t('dEpics'),sEpics,'var(--green)');
        h+=ms(t('dSubtasks'),sSubtasks,'var(--accent)');
        h+=ms(t('dTime'),fmtHours(sHours),'var(--purple)');
        h+='</div>';
        h+='</div>';
    }
    h+='</div>';

    // ROW 3: radar + comparison (only if both)
    if(hasBoth){
        h+='<div class="dv2-row c2">';
        h+='<div class="dp reveal-scale"><h3>&#x1F4CA; '+t('dMethodologyRadar')+'</h3><div class="radar-wrap" id="radarChart"></div></div>';
        h+='<div class="dp reveal-scale" style="--reveal-delay:.1s"><h3>&#x1F4CB; '+t('dComparison')+'</h3>';
        // helper: ratio per planning unit, rounded to 1 decimal
        const rpu=(val,units)=>units>0?(val/units).toFixed(1):'–';
        h+='<table class="cmp2"><thead><tr><th>'+t('dMetric')+'</th><th style="color:var(--accent)">PRINCE2</th><th style="color:var(--green)">Scrum</th></tr></thead><tbody>';
        h+='<tr class="cmp-sep"><td colspan="3">'+t('cmpStructure')+'</td></tr>';
        h+='<tr><td>'+t('cmpFazySprinty')+'</td><td><strong>'+pStages+'</strong> fáz</td><td><strong>'+sSprints+'</strong> sprintov</td></tr>';
        h+='<tr><td>'+t('cmpUlohyStories')+'</td><td><strong>'+pTasks+'</strong> úloh</td><td><strong>'+sStories+'</strong> stories</td></tr>';
        h+='<tr><td>'+t('cmpUlohNaJednotku')+'</td><td>'+rpu(pTasks,pStages)+'</td><td>'+rpu(sStories,sSprints)+'</td></tr>';
        h+='<tr class="cmp-sep"><td colspan="3">'+t('cmpCasovaNarocnost')+'</td></tr>';
        h+='<tr><td>'+t('cmpCelkovyCas')+'</td><td><strong>'+fmtHours(pHours)+'</strong></td><td><strong>'+fmtHours(sHours)+'</strong></td></tr>';
        h+='<tr><td>'+t('cmpPriemCas')+'</td><td>'+fmtHours(pTasks>0?Math.round(pHours/pTasks):0)+'</td><td>'+fmtHours(sStories>0?Math.round(sHours/sStories):0)+'</td></tr>';
        h+='<tr class="cmp-sep"><td colspan="3">'+t('cmpRizikaAPriority')+'</td></tr>';
        h+='<tr><td>'+t('cmpRizikaSpolu')+'</td><td><strong>'+pRisks+'</strong></td><td><strong>'+sRisks+'</strong></td></tr>';
        h+='<tr><td>'+t('cmpRizikaPerJednotku')+'</td><td>'+rpu(pRisks,pStages)+'</td><td>'+rpu(sRisks,sSprints)+'</td></tr>';
        h+='<tr><td>'+t('cmpPrioritaVysoka')+'</td><td style="color:var(--danger)"><strong>'+pHighPri+'</strong> ('+Math.round(pHighPri/(pHighPri+pMedPri+pLowPri||1)*100)+'%)</td><td style="color:var(--danger)"><strong>'+sHighPri+'</strong> ('+Math.round(sHighPri/(sHighPri+sMedPri+sLowPri||1)*100)+'%)</td></tr>';

        h+='</tbody></table></div>';

    // ROW 4: risk overview

    h+='</div>';

    h+='</div>';

// ---- Dashboard V2 helpers ----
function sc2(icon,val,label,style){
    return '<div class="sv2" style="'+style+'"><div class="si">'+icon+'</div><div class="sn" data-target="'+val+'">0</div><div class="sl">'+esc(label)+'</div></div>';
}
function dlItem(color,label,count){
    return '<div class="donut-legend-item"><div class="donut-dot" style="background:'+color+'"></div><span>'+esc(label)+': <strong>'+count+'</strong></span></div>';
}
function ms(label,val,color){
    return '<div class="mini-stat"><span class="ms-label">'+esc(label)+'</span><span class="ms-val" style="color:'+color+'">'+(typeof val==='number'?val:esc(val))+'</span></div>';
}
function riskBlocks(hi,med,lo,totalRisks){
    let h='<div class="risk-blocks">';
    h+='<div class="risk-blk" style="background:var(--danger-dim)"><div class="rv" style="color:var(--danger)">'+hi+'</div><div class="rl">'+t('dHigh')+'</div></div>';
    h+='<div class="risk-blk" style="background:var(--yellow-dim)"><div class="rv" style="color:var(--yellow)">'+med+'</div><div class="rl">'+t('dMedium')+'</div></div>';
    h+='<div class="risk-blk" style="background:var(--green-dim)"><div class="rv" style="color:var(--green)">'+lo+'</div><div class="rl">'+t('dLow')+'</div></div>';
    h+='</div>';
    h+='<div style="margin-top:10px;font-size:.78rem;color:var(--muted)">'+t('dTotalItems')+': '+totalRisks+' '+t('dRisks').toLowerCase()+'</div>';
    return h;
}

function buildRadarData(pStages,pTasks,pHours,pRisks,pHighPri,pMedPri,pLowPri,sSprints,sStories,sHours,sRisks,sHighPri,sMedPri,sLowPri){
    // Global normalization: each axis uses its own max so actual project values shape the polygon
    function n(a,b){const m=Math.max(a,b,1);return[+(a/m).toFixed(3),+(b/m).toFixed(3)];}
    const[fP,fS]=n(pStages,sSprints);           // fázy vs sprinty
    const[uP,uS]=n(pTasks,sStories);             // úlohy vs stories
    const[tP,tS]=n(pHours,sHours);               // čas
    const[rP,rS]=n(pRisks,sRisks);               // riziká
    const pAllPri=pHighPri+pMedPri+pLowPri, sAllPri=sHighPri+sMedPri+sLowPri;
    const[priP,priS]=n(pHighPri,sHighPri);        // vysoká priorita
    return{
        labels:[t('dRadarFazy'),t('dRadarUlohy'),t('dRadarCas'),t('dRadarRizika'),t('dRadarPriorita')],
        p2raw:[pStages,pTasks,pHours,pRisks,pHighPri],
        scraw:[sSprints,sStories,sHours,sRisks,sHighPri],
        datasets:[
            {values:[fP,uP,tP,rP,priP],color:'var(--accent)',label:'PRINCE2'},
            {values:[fS,uS,tS,rS,priS],color:'var(--green)',label:'Scrum'}
        ]
    };
}

// ---- SVG donut chart ----
function drawDonutChart(id,values,colors){
    const el=document.getElementById(id);if(!el)return;
    const total=values.reduce((a,b)=>a+b,0);
    if(!total){el.innerHTML='<svg viewBox="0 0 150 150" width="150" height="150"><circle cx="75" cy="75" r="54" fill="none" stroke="var(--border)" stroke-width="16"/><text x="75" y="75" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" font-size=".8rem">0</text></svg>';return;}
    const sz=150,cx=75,cy=75,r=54,sw=16;
    const circ=2*Math.PI*r;
    let svg='<svg viewBox="0 0 '+sz+' '+sz+'" width="'+sz+'" height="'+sz+'">';
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+sw+'" opacity=".3"/>';
    let cum=-90;
    values.forEach((v,i)=>{
        if(!v)return;
        const pct=v/total,dashLen=circ*pct,dashGap=circ-dashLen;
        svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i]+'" stroke-width="'+sw+'" ';
        svg+='stroke-dasharray="'+dashLen.toFixed(2)+' '+dashGap.toFixed(2)+'" ';
        svg+='transform="rotate('+cum+' '+cx+' '+cy+')" ';
        svg+='style="transition:stroke-dasharray .8s ease;cursor:pointer" ';
        svg+='data-tip="'+v+' ('+Math.round(pct*100)+'%)" />';
        cum+=pct*360;
    });
    svg+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central" fill="var(--text)" font-size="1.6rem" font-weight="700">'+total+'</text>';

// ---- SVG radar chart ----
function drawRadarChart(id,data){
    const el=document.getElementById(id);if(!el||!data)return;
    const labels=data.labels,sets=data.datasets,n=labels.length;
    const sz=300,cx=sz/2,cy=sz/2,maxR=105;
    let svg='<svg viewBox="0 0 '+sz+' '+sz+'" width="'+sz+'" height="'+sz+'">';
    // grid
    for(let lv=1;lv<=3;lv++){
        const lr=maxR*lv/3;let pts='';
        for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2;pts+=(cx+lr*Math.cos(a))+','+(cy+lr*Math.sin(a))+' ';}
        svg+='<polygon points="'+pts.trim()+'" fill="none" stroke="var(--border)" stroke-width="1" opacity=".5"/>';
    }
    // axes
    for(let i=0;i<n;i++){
        const a=Math.PI*2*i/n-Math.PI/2;
        svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+maxR*Math.cos(a))+'" y2="'+(cy+maxR*Math.sin(a))+'" stroke="var(--border)" stroke-width="1" opacity=".4"/>';
        const lx=cx+(maxR+22)*Math.cos(a),ly=cy+(maxR+22)*Math.sin(a);
        svg+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" font-size=".72rem">'+labels[i]+'</text>';
    }
    // data polygons
    const rawKeys=['p2raw','scraw'];
    sets.forEach((ds,di)=>{
        const rawArr=data[rawKeys[di]]||[];
        let pts='';
        for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2,vr=maxR*(ds.values[i]||0);pts+=(cx+vr*Math.cos(a)).toFixed(1)+','+(cy+vr*Math.sin(a)).toFixed(1)+' ';}
        svg+='<polygon points="'+pts.trim()+'" fill="'+ds.color+'" fill-opacity=".12" stroke="'+ds.color+'" stroke-width="2.5" stroke-linejoin="round"/>';
        for(let i=0;i<n;i++){
            const a=Math.PI*2*i/n-Math.PI/2,vr=maxR*(ds.values[i]||0);
            const rawVal=rawArr[i]!=null?rawArr[i]:'';
            const tip=labels[i]+': '+(rawVal!==''?rawVal:'–')+' ('+Math.round((ds.values[i]||0)*100)+'%)';
            svg+='<circle cx="'+(cx+vr*Math.cos(a)).toFixed(1)+'" cy="'+(cy+vr*Math.sin(a)).toFixed(1)+'" r="4.5" fill="'+ds.color+'" stroke="var(--surface)" stroke-width="2" data-tip="'+tip+'"/>';
        }
    });
    svg+='</svg>';
    // legend
    let legend='<div style="display:flex;justify-content:center;gap:24px;margin-top:10px">';
    sets.forEach(ds=>{
        legend+='<div style="display:flex;align-items:center;gap:6px;font-size:.8rem"><div style="width:14px;height:3px;background:'+ds.color+';border-radius:2px"></div><span style="color:var(--muted)">'+ds.label+'</span></div>';
    });
    legend+='</div>';
    el.innerHTML=svg+legend;
}

// ---- Animated counters ----
function animateCounters(){
    document.querySelectorAll('.sn[data-target]').forEach(el=>{
        const raw=el.dataset.target,target=parseFloat(raw);
        if(isNaN(target)){el.textContent=raw;return;}
        if(target===0){el.textContent='0';return;}
        const dur=700,start=performance.now();
        (function step(now){
            const p=Math.min((now-start)/dur,1);
            const eased=1-Math.pow(1-p,3);
            el.textContent=Math.round(target*eased);
            if(p<1)requestAnimationFrame(step);
        })(start);
    });
}

// ========================= ACCORDION SCROLL TRIGGER (GSAP) =========================
function setupAccordionScrollTrigger() {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);

    const scroller = document.querySelector('.detail-panel');
    if (!scroller) return;

    // Kill any previous ScrollTrigger instances to avoid duplicates
    ScrollTrigger.getAll().forEach(st => st.kill());

    const accordions = document.querySelectorAll('#detailContent .accordion');
    if (!accordions.length) return;

    // Start all accordions hidden (slide up entrance)
    gsap.set(accordions, { opacity: 0, y: 22, clearProps: 'none' });

    accordions.forEach((acc, i) => {
        ScrollTrigger.create({
            trigger: acc,
            scroller: scroller,
            start: 'top 88%',
            once: true,
            onEnter: () => {
                // 1. Slide the accordion card in
                gsap.to(acc, {
                    opacity: 1,
                    y: 0,
                    duration: 0.42,
                    delay: i * 0.04,
                    ease: 'power3.out',
                    onComplete: () => {
                        // 2. Auto-open the body after card appears
                        const body = acc.querySelector('.acc-body');
                        const arrow = acc.querySelector('.acc-arrow');
                        if (!body || body.classList.contains('open')) return;
                        body.classList.add('open');
                        gsap.from(body, {
                            height: 0,
                            opacity: 0,
                            duration: 0.48,
                            ease: 'power2.out',
                            clearProps: 'height,opacity'
                        });
                        if (arrow) arrow.textContent = '\u25B2';
                        // Typewriter + chip counters on auto-open
                        typewriterEl(acc.querySelector('.acc-title'));
                        animateChips(body);
                    }
                });
            }
        });
    });

    // Vertical line scrub draw animation
    setupVline(scroller);

    // Floating mini-map
    setupMinimap(accordions);
}

function setupScrollReveal(){
    const root=document.getElementById('detailContent');
    if(!root)return;
    // Rows fade up
    const rows=root.querySelectorAll('#dashV2 .dv2-row');
    // Individual .dp panels inside rows
    const panels=root.querySelectorAll('#dashV2 .dp');
    // Table rows inside comparison table
    const cmpRows=root.querySelectorAll('#dashV2 .cmp2 tbody tr:not(.cmp-sep)');
    // Timeline nodes
    const tlNodes=root.querySelectorAll('#dashV2 .tl-node');
    // Risk blocks
    const riskBlks=root.querySelectorAll('#dashV2 .risk-blk');

    const scroller=document.querySelector('.detail-panel');
    const obs=new IntersectionObserver((entries)=>{
        entries.forEach(e=>{
            if(e.isIntersecting){
                e.target.classList.add('in-view');
                obs.unobserve(e.target);
            }
        });
    },{root:scroller,threshold:0.08});

    // Rows: staggered fade-up
    rows.forEach((el,i)=>{
        el.classList.add('reveal');
        el.style.transitionDelay=(i*0.07)+'s';
        obs.observe(el);
    });
    // Panels: scale-in with slight delay offset inside each row
    panels.forEach((el,i)=>{
        if(!el.classList.contains('reveal-scale'))el.classList.add('reveal-scale');
        el.style.transitionDelay=(0.04+i*0.06)+'s';
        obs.observe(el);
    });
    // Comparison table rows: fast stagger
    cmpRows.forEach((el,i)=>{
        el.style.opacity='0';
        el.style.transform='translateX(-10px)';
        el.style.transition='opacity .3s ease,transform .3s ease';
        el.style.transitionDelay=(0.05+i*0.04)+'s';
        obs.observe(el);
        // override onIntersect for table rows
    });
    // Timeline nodes
    tlNodes.forEach((el,i)=>{
        el.style.opacity='0';
        el.style.transform='translateY(12px) scale(.9)';
        el.style.transition='opacity .35s ease,transform .35s ease';
        el.style.transitionDelay=(i*0.08)+'s';
        obs.observe(el);
    });
    // Risk blocks
    riskBlks.forEach((el,i)=>{
        el.style.opacity='0';
        el.style.transform='scale(.85)';
        el.style.transition='opacity .4s ease,transform .4s cubic-bezier(.34,1.56,.64,1)';
        el.style.transitionDelay=(i*0.07)+'s';
        obs.observe(el);
    });

    // Extended observer for inline-styled elements (tables rows, tl-nodes, risk-blks)
    const obs2=new IntersectionObserver((entries)=>{
        entries.forEach(e=>{
            if(e.isIntersecting){
                e.target.style.opacity='1';
                e.target.style.transform='none';
                obs2.unobserve(e.target);
            }
        });
    },{root:scroller,threshold:0.05});
    [...cmpRows,...tlNodes,...riskBlks].forEach(el=>obs2.observe(el));
}

function initDashboardAnimations(){
    const d=document.getElementById('dashV2');if(!d)return;
    animateCounters();

    const data=window._dashData;if(!data)return;

// ======= EDIT ACTIONS: COLLECT & SAVE =======
function collectEdits() {
    if (!state.xmlDoc) return;
    // PRINCE2
    const p2 = state.xmlDoc.querySelector('PRINCE2Project');
    if (p2) {
        const stages = Array.from(p2.querySelectorAll('Stages > Stage'));
        document.querySelectorAll('.accordion[data-si]').forEach(acc => {
            const si = +acc.dataset.si;
            const stage = stages[si]; if (!stage) return;
            acc.querySelectorAll(':scope > .acc-body > .edit-row [data-tag]').forEach(inp => {
                setXmlText(stage, inp.dataset.tag, inp.value);
            });
            // outputs
            const outList = acc.querySelector('[data-list="outputs"]');
            if (outList) {
                let outs = stage.querySelector('Outputs');
                if (!outs) { outs = state.xmlDoc.createElement('Outputs'); stage.appendChild(outs); }
                outs.innerHTML = '';
                outList.querySelectorAll('input.edit-input').forEach(inp => {
                    const o = state.xmlDoc.createElement('Output'); o.textContent = inp.value; outs.appendChild(o);
                });
            }
            // risks
            const riskList = acc.querySelector('[data-list="risks"]');
            if (riskList) {
                let rsk = stage.querySelector('Risks');
                if (!rsk) { rsk = state.xmlDoc.createElement('Risks'); stage.appendChild(rsk); }
                rsk.innerHTML = '';
                riskList.querySelectorAll('input.edit-input').forEach(inp => {
                    const r = state.xmlDoc.createElement('Risk'); r.textContent = inp.value; rsk.appendChild(r);
                });
            }
            // tasks
            const taskCards = Array.from(acc.querySelectorAll('.nested-card[data-ti]'));
            const xmlTasks = Array.from(stage.querySelectorAll('Tasks > Task'));
            taskCards.forEach((card, ti) => {
                const xmlTask = xmlTasks[ti]; if (!xmlTask) return;
                card.querySelectorAll('[data-tag]').forEach(inp => setXmlText(xmlTask, inp.dataset.tag, inp.value));
            });
        });
    }
    // Scrum
    const sc = state.xmlDoc.querySelector('ScrumProject');
    if (sc) {
        const sprints = Array.from(sc.querySelectorAll('Sprints > Sprint'));
        document.querySelectorAll('.accordion[data-spri]').forEach(acc => {
            const si = +acc.dataset.spri;
            const sprint = sprints[si]; if (!sprint) return;
            acc.querySelectorAll(':scope > .acc-body > .edit-row [data-tag]').forEach(inp => {
                setXmlText(sprint, inp.dataset.tag, inp.value);
            });
            const epicCards = Array.from(acc.querySelectorAll('.nested-card[data-ei]'));
            const xmlEpics = Array.from(sprint.querySelectorAll('Epics > Epic'));
            epicCards.forEach((eCard, ei) => {
                const xmlEpic = xmlEpics[ei]; if (!xmlEpic) return;
                eCard.querySelectorAll(':scope > .edit-row [data-tag]').forEach(inp => setXmlText(xmlEpic, inp.dataset.tag, inp.value));
                const storyCards = Array.from(eCard.querySelectorAll('.nested-card[data-sti]'));
                const xmlStories = Array.from(xmlEpic.querySelectorAll('Stories > Story'));
                storyCards.forEach((sCard, sti) => {
                    const xmlStory = xmlStories[sti]; if (!xmlStory) return;
                    sCard.querySelectorAll(':scope > .edit-row [data-tag]').forEach(inp => setXmlText(xmlStory, inp.dataset.tag, inp.value));
                    // criteria
                    const critList = sCard.querySelector('[data-list="criteria"]');
                    if (critList) {
                        let ac = xmlStory.querySelector('AcceptanceCriteria');
                        if (!ac) { ac = state.xmlDoc.createElement('AcceptanceCriteria'); xmlStory.appendChild(ac); }
                        ac.innerHTML = '';
                        critList.querySelectorAll('input.edit-input').forEach(inp => {
                            const c = state.xmlDoc.createElement('Criterion'); c.textContent = inp.value; ac.appendChild(c);
                        });
                    }
                    // subtasks
                    const stCards = Array.from(sCard.querySelectorAll('.nested-card[data-ti]'));
                    const xmlSubs = Array.from(xmlStory.querySelectorAll('SubTasks > Task'));
                    stCards.forEach((tCard, ti) => {
                        const xmlSub = xmlSubs[ti]; if (!xmlSub) return;
                        tCard.querySelectorAll('[data-tag]').forEach(inp => setXmlText(xmlSub, inp.dataset.tag, inp.value));
                    });
                });
            });
        });
    }
}

async function saveEdits(projectId) {
    collectEdits();
    const xml = new XMLSerializer().serializeToString(state.xmlDoc);
    try {
        const project = state.projects.find(p => p.id === projectId);
        const r = await fetch('/api/projects/' + projectId, {
            method:'PUT', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({name: project.name, description: project.description, xmlContent: xml})
        });
        if (!r.ok) throw new Error('HTTP '+r.status);
        state.editMode = false; state.xmlDoc = null;
        await loadProjects();
        toast(t('editsSaved'), 'success');
    } catch (err) { toast(t('editsSaveFail')+': '+err.message, 'error'); }
}

// ======= EDIT ACTIONS: ADD/REMOVE =======
function removeNode(btn, type) { btn.closest('.nested-card,.accordion').remove(); }
function removeListItem(btn) { btn.closest('.edit-row').remove(); }

function addListItem(btn, type) {
    const row = document.createElement('div'); row.className = 'edit-row';
    row.innerHTML = `<input class="edit-input" value=""><button class="btn-icon danger" onclick="removeListItem(this)">&times;</button>`;
    btn.parentNode.insertBefore(row, btn);
}

function addTask(btn, si) {
    const p2 = state.xmlDoc.querySelector('PRINCE2Project');
    const stages = Array.from(p2.querySelectorAll('Stages > Stage'));
    const stage = stages[si]; if (!stage) return;
    let tasks = stage.querySelector('Tasks');
    if (!tasks) { tasks = state.xmlDoc.createElement('Tasks'); stage.appendChild(tasks); }
    const tk = state.xmlDoc.createElement('Task');
    ['Title','Description','Priority','OriginalEstimate'].forEach(tag => { const el = state.xmlDoc.createElement(tag); el.textContent = tag==='Priority'?'Medium':''; tk.appendChild(el); });
    tasks.appendChild(tk);
    renderDetail(state.activeId);
}

function addStage() {
    const p2 = state.xmlDoc.querySelector('PRINCE2Project');
    let stages = p2.querySelector('Stages');
    if (!stages) { stages = state.xmlDoc.createElement('Stages'); p2.appendChild(stages); }
    const s = state.xmlDoc.createElement('Stage');
    ['Name','Description','Priority','Component','OriginalEstimate','DueDate'].forEach(tag => { const el = state.xmlDoc.createElement(tag); el.textContent = tag==='Priority'?'Medium':''; s.appendChild(el); });
    const tasks = state.xmlDoc.createElement('Tasks'); s.appendChild(tasks);
    const outs = state.xmlDoc.createElement('Outputs'); s.appendChild(outs);
    const risks = state.xmlDoc.createElement('Risks'); s.appendChild(risks);
    stages.appendChild(s);
    collectEdits();
    renderDetail(state.activeId);
}

function addEpic(btn, si) {
    const sc = state.xmlDoc.querySelector('ScrumProject');
    const sprint = Array.from(sc.querySelectorAll('Sprints > Sprint'))[si]; if (!sprint) return;
    let epics = sprint.querySelector('Epics');
    if (!epics) { epics = state.xmlDoc.createElement('Epics'); sprint.appendChild(epics); }
    const ep = state.xmlDoc.createElement('Epic');
    ['Title','Description','Priority','Component','Labels'].forEach(tag => { const el = state.xmlDoc.createElement(tag); el.textContent = tag==='Priority'?'Medium':''; ep.appendChild(el); });
    const stories = state.xmlDoc.createElement('Stories'); ep.appendChild(stories);
    epics.appendChild(ep);
    collectEdits();
    renderDetail(state.activeId);
}

function addStory(btn, si, ei) {
    const sc = state.xmlDoc.querySelector('ScrumProject');
    const epic = Array.from(sc.querySelectorAll('Sprints > Sprint'))[si]?.querySelectorAll('Epics > Epic')[ei]; if (!epic) return;
    let stories = epic.querySelector('Stories');
    if (!stories) { stories = state.xmlDoc.createElement('Stories'); epic.appendChild(stories); }
    const st = state.xmlDoc.createElement('Story');
    ['Title','Description','StoryPoints','Priority','OriginalEstimate','DueDate','Labels'].forEach(tag => {
        const el = state.xmlDoc.createElement(tag); el.textContent = tag==='Priority'?'Medium':tag==='StoryPoints'?'3':''; st.appendChild(el);
    });
    st.appendChild(state.xmlDoc.createElement('AcceptanceCriteria'));
    st.appendChild(state.xmlDoc.createElement('SubTasks'));
    stories.appendChild(st);
    collectEdits();
    renderDetail(state.activeId);
}

function addSubtask(btn, si, ei, sti) {
    const sc = state.xmlDoc.querySelector('ScrumProject');
    const story = Array.from(sc.querySelectorAll('Sprints > Sprint'))[si]?.querySelectorAll('Epics > Epic')[ei]?.querySelectorAll('Stories > Story')[sti];
    if (!story) return;
    let subs = story.querySelector('SubTasks');
    if (!subs) { subs = state.xmlDoc.createElement('SubTasks'); story.appendChild(subs); }
    const tk = state.xmlDoc.createElement('Task');
    ['Title','Description','Priority','OriginalEstimate'].forEach(tag => { const el = state.xmlDoc.createElement(tag); el.textContent = tag==='Priority'?'Medium':''; tk.appendChild(el); });
    subs.appendChild(tk);
    collectEdits();
    renderDetail(state.activeId);
}

// ========================= DECORATION EFFECTS =========================

// 1. Vertical line — GSAP scrub draw (called inside setupAccordionScrollTrigger)
function setupVline(scroller) {
    const vline = document.querySelector('#detailContent .acc-vline');
    if (!vline || !window.gsap || !window.ScrollTrigger) return;
    const wrap = vline.closest('.acc-timeline-wrap');
    if (!wrap) return;
    gsap.set(vline, {scaleY: 0});
    ScrollTrigger.create({
        trigger: wrap,
        scroller: scroller,
        start: 'top 85%',
        end: 'bottom 15%',
        scrub: 1.2,
        onUpdate: self => { gsap.set(vline, {scaleY: self.progress}); }
    });
}

// 2. Floating mini-map navigator (fixed right side)
function clearMinimap() {
    const mm = document.getElementById('accMinimap');
    if (mm) mm.remove();
}
function setupMinimap(accordions) {
    clearMinimap();
    if (!accordions || !accordions.length) return;
    const themeColors = ['var(--accent)','var(--green)','var(--purple)','var(--yellow)','var(--teal)'];
    const mm = document.createElement('div');
    mm.className = 'acc-minimap'; mm.id = 'accMinimap';
    const dots = [];
    accordions.forEach((acc, i) => {
        const theme = +(acc.dataset.theme||1);
        const clr = themeColors[(theme-1)%5];
        const dot = document.createElement('button');
        dot.className = 'minimap-dot';
        dot.style.setProperty('--dot-clr', clr);
        const nameEl = acc.querySelector('.acc-title');
        const label = nameEl ? nameEl.textContent.trim() : 'Item '+(i+1);
        const tip = document.createElement('span');
        tip.className = 'dot-tooltip';
        tip.textContent = label.length > 22 ? label.slice(0,20)+'…' : label;
        dot.appendChild(tip);
        dot.addEventListener('click', () => acc.scrollIntoView({behavior:'smooth', block:'start'}));
        mm.appendChild(dot);
        dots.push(dot);
    });
    document.body.appendChild(mm);
    // Observe accordion visibility to highlight active dot
    const scroller = document.querySelector('.detail-panel');
    const obs = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            const idx = Array.from(accordions).indexOf(entry.target);
            if (idx !== -1 && dots[idx]) dots[idx].classList.toggle('active', entry.isIntersecting);
        });
    }, {root: scroller, threshold: 0.25});
    accordions.forEach(acc => obs.observe(acc));
}

// 3. Stat counter — animate acc-chip numbers from 0 on accordion open
function animateChips(body) {
    if (!body || !window.gsap) return;
    body.querySelectorAll('.acc-chip').forEach(chip => {
        if (chip.dataset.chipped) return;
        chip.dataset.chipped = '1';
        const m = chip.textContent.match(/^(\d+)(.*)/);
        if (!m) return;
        const target = +m[1], suffix = m[2];
        const obj = {val: 0};
        gsap.to(obj, {val: target, duration: 0.65, ease: 'power2.out',
            onUpdate: () => { chip.textContent = Math.round(obj.val) + suffix; }
        });
    });
}

// 4. Ripple effect on header click
function spawnRipple(e, header) {
    const r = document.createElement('span');
    r.className = 'acc-ripple';
    const rect = header.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.6;
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size / 2) + 'px';
    r.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
    header.appendChild(r);
    if (window.gsap) {
        gsap.fromTo(r, {scale: 0, opacity: 0.28}, {scale: 1, opacity: 0, duration: 0.6, ease: 'power2.out', onComplete: () => r.remove()});
    } else { setTimeout(() => r.remove(), 650); }
}

// 6. Typewriter for acc-title on first open
function typewriterEl(el) {
    if (!el || el.dataset.typed) return;
    el.dataset.typed = '1';
    const text = el.textContent;
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.textContent = '|';
    cursor.style.cssText = 'animation:twCursor .7s step-end infinite;color:var(--theme-clr,var(--accent))';
    el.appendChild(cursor);
    let i = 0;
    const iv = setInterval(() => {
        cursor.before(document.createTextNode(text[i]));
        i++;
        if (i >= text.length) { clearInterval(iv); setTimeout(() => cursor.remove(), 900); }
    }, 32);
}

// ========================= HELPERS =========================
function buildChips(node, fields) {
    return fields.map(f => {
        const v = txt(node,f); if (!v) return '';
        if (f==='Priority') return `<span class="acc-chip pri-${v.toLowerCase()}">${esc(v)}</span>`;
        if (f==='Component') return `<span class="acc-chip component">${esc(v)}</span>`;
        if (f==='OriginalEstimate') return `<span class="acc-chip estimate">${esc(v)}</span>`;
        if (f==='StoryPoints') return `<span class="acc-chip points">${esc(v)} SP</span>`;
        if (f==='DueDate') return `<span class="acc-chip date">${esc(v)}</span>`;
        return `<span class="acc-chip" style="background:rgba(255,255,255,.06);color:var(--muted)">${esc(v)}</span>`;
    }).join('');
}
function labelsChips(str) {
    return str.split(',').map(l=>l.trim()).filter(Boolean).map(l=>`<span class="acc-chip" style="background:rgba(255,255,255,.05);color:var(--muted);font-size:.7rem">#${esc(l)}</span>`).join('');
}
function listItems(node, wrapper, item) {
    const w = node.querySelector(wrapper); if (!w) return [];
    return Array.from(w.querySelectorAll(item)).map(el=>el.textContent.trim()).filter(Boolean);
}
function txt(node, tag) { const el = node?node.querySelector(tag):null; return el?el.textContent.trim():''; }
function parseXml(xmlContent) {
    if (!xmlContent) return {prince2:null,scrum:null};
    let c = xmlContent.trim();
    const lo = c.toLowerCase();
    const s = lo.indexOf('<projectplans>'), e = lo.lastIndexOf('</projectplans>');
    if (s!==-1 && e!==-1) c = c.slice(s, e+'</projectplans>'.length);
    const doc = new DOMParser().parseFromString(c,'text/xml');
    if (doc.querySelector('parsererror')) return {prince2:null,scrum:null};
    return { prince2: doc.querySelector('PRINCE2Project'), scrum: doc.querySelector('ScrumProject') };
}
function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function buildJiraLink(projectId) {
    const links = jiraExports[projectId]; if (!links) return '';
    // Show single Jira project link (both methodologies export to the same project)
    const link = links.prince2 || links.scrum;
    if (!link) return '';
    return `<div style="display:flex;gap:8px;flex-wrap:wrap"><a href="${link.url}" target="_blank" class="btn btn-success" style="text-decoration:none">Jira: ${link.key}</a></div>`;
}

async function deleteProject(id) {
    if (!confirm(t('confirmDelete'))) return;
    try {
        await fetch('/api/projects/'+id, {method:'DELETE'});
        delete jiraExports[id];
        localStorage.setItem('jiraExports', JSON.stringify(jiraExports));
        state.activeId = null;
        await loadProjects();
        document.getElementById('detailContent').style.display='none';
        document.getElementById('detailEmpty').style.display='flex';
        toast(t('deleteOk'), 'success');
    } catch (err) { toast(t('deleteFail'), 'error'); }
}

async function doExport(id, methodology) {
    const project = state.projects.find(p => p.id === id);
    if (!project) return;
    // Validate first
    const errors = validateXmlForExport(project.xmlContent, methodology);
    if (errors.length) {
        showValidationModal(errors, () => exportProject(id, methodology));
        return;
    }
    exportProject(id, methodology);
}

async function exportProject(id, methodology) {
    const project = state.projects.find(p => p.id === id);
    if (!project) return;
    setLoading(true);

    // Show loading overlay with export progress
    const titleText = state.lang==='sk' ? 'Export do Jira...' : 'Exporting to Jira...';
    const subText = state.lang==='sk'
        ? `Odosielam ${methodology} úlohy do Jira projektu.`
        : `Sending ${methodology} tasks to Jira project.`;
    showLoadingOverlay(titleText, subText);

    // Parse XML to show what's being exported
    const parsed = parseXml(project.xmlContent);
    if (methodology === 'PRINCE2' && parsed.prince2) {
        const stages = Array.from(parsed.prince2.querySelectorAll('Stages > Stage'));
        stages.forEach((s,i) => {
            const name = txt(s,'Name') || ('Stage '+(i+1));
            addLoadingLog('→ ' + name);
            const tasks = Array.from(s.querySelectorAll('Tasks > Task'));
            tasks.forEach(tk => addLoadingLog('   ↳ ' + (txt(tk,'Title') || 'Task')));
        });
    } else if (methodology === 'Scrum' && parsed.scrum) {
        const sprints = Array.from(parsed.scrum.querySelectorAll('Sprints > Sprint'));
        sprints.forEach((sp,i) => {
            const name = txt(sp,'Name') || ('Sprint '+(i+1));
            addLoadingLog('→ ' + name);
            const epics = Array.from(sp.querySelectorAll('Epics > Epic'));
            epics.forEach(ep => {
                addLoadingLog('   ↳ ' + (txt(ep,'Title') || 'Epic'));
                const stories = Array.from(ep.querySelectorAll('Stories > Story'));
                stories.forEach(st => addLoadingLog('      • ' + (txt(st,'Title') || 'Story')));
            });
        });
    }

    try {
        const r = await fetch('/api/projects/'+id+'/export-to-jira', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({methodology, projectName: project.name})
        });
        const result = await r.json();
        if (result.success) {
            if (!jiraExports[id]) jiraExports[id] = {};
            jiraExports[id][methodology.toLowerCase()] = {key: result.projectKey, url: result.projectUrl};
            localStorage.setItem('jiraExports', JSON.stringify(jiraExports));
            const ic = result.issues?result.issues.length:0;
            const ec = result.errors?result.errors.length:0;
            if (ec>0) {
                addLoadingLog('⚠ ' + tf('exportPartial',ic,ec), 'err');
                result.errors.forEach(e => addLoadingLog('  ✗ '+e, 'err'));
                // Keep overlay visible for 2s so user can read errors
                await new Promise(r => setTimeout(r, 2000));
                toast(tf('exportPartial',ic,ec),'info');
                console.warn('Export errors:',result.errors);
            } else {
                addLoadingLog('✓ ' + tf('exported',ic), 'ok');
                toast(tf('exported',ic),'success');
            }
            renderDetail(id);
        } else {
            let msg = result.message||'Unknown error';
            addLoadingLog('✗ ' + msg, 'err');
            if (result.errors&&result.errors.length) {
                result.errors.forEach(e => addLoadingLog('  ✗ '+e, 'err'));
                msg += '\n'+result.errors[0];
            }
            await new Promise(r => setTimeout(r, 2000));
            toast(t('exportFail')+': '+msg, 'error');
        }
    } catch (err) {
        addLoadingLog('✗ ' + err.message, 'err');
        toast(t('exportFail')+': '+err.message, 'error');
    }
    finally {
        setLoading(false);
        removeLoadingOverlay();
    }
}

// ========================= JIRA TEST =========================
async function testJiraConnection() {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '⏳ Testujem…';
    btn.disabled = true;
    try {
        const r = await fetch('/api/jira/test');
        const data = await r.json();
        if (data.connected) {
            let msg = '✅ Jira OK — ' + (data.user || '');
            if (data.projectFound) msg += ' | Projekt: ' + (data.projectName || '');
            else msg += ' | ⚠️ Projekt nenájdený: ' + (data.projectError || '');
            toast(msg, data.projectFound ? 'success' : 'info');
        } else {
            toast('❌ ' + (data.error || 'Jira pripojenie zlyhalo'), 'error');
        }
    } catch (err) {
        toast('❌ Chyba pri testovaní Jira: ' + err.message, 'error');
    } finally {
        btn.textContent = orig;
        btn.disabled = false;
    }
}
