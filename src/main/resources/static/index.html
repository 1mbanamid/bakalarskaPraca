<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Project Planner</title>
<style>
:root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-alt: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,.15);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,.15);
    --purple: #bc8cff;
    --purple-dim: rgba(188,140,255,.15);
    --danger: #f85149;
    --danger-dim: rgba(248,81,73,.12);
    --yellow: #d29922;
    --yellow-dim: rgba(210,153,34,.15);
    --radius: 8px;
    --radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:grid;grid-template-columns:320px 1fr;overflow:hidden}

/* ======== SIDEBAR ======== */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:1.15rem;font-weight:600;display:flex;align-items:center;gap:10px}
.sidebar-header h1 span{font-size:1.3rem}
.sidebar-list{flex:1;overflow-y:auto;padding:8px}
.sidebar-item{padding:10px 14px;border-radius:var(--radius);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .12s}
.sidebar-item:hover{background:rgba(255,255,255,.04)}
.sidebar-item.active{background:var(--accent-dim);color:var(--accent)}
.sidebar-item .name{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sidebar-item .date{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sidebar-empty{padding:24px;text-align:center;color:var(--muted);font-size:.9rem}
.btn-new{margin:12px;padding:10px;border-radius:var(--radius);border:1px dashed var(--border);background:transparent;color:var(--accent);font-weight:600;cursor:pointer;font-size:.9rem;transition:background .12s,border-color .12s}
.btn-new:hover{background:var(--accent-dim);border-color:var(--accent)}

/* ======== MAIN ======== */
.main{height:100vh;overflow-y:auto;display:flex;flex-direction:column}

/* -- Create form -- */
.create-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:28px 32px;display:none;flex-direction:column;gap:18px}
.create-panel.active{display:flex}
.create-panel h2{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field label{font-size:.8rem;font-weight:500;color:var(--muted)}
.form-field input,.form-field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius);font:inherit;font-size:.9rem;transition:border-color .15s}
.form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--accent)}
.form-field textarea{resize:vertical;min-height:90px}
.form-actions{display:flex;gap:10px;justify-content:flex-end}

/* -- Detail view -- */
.detail-panel{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem;text-align:center}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
.detail-header h2{font-size:1.3rem;font-weight:600}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap}
.meta-chip{padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:500;border:1px solid var(--border);color:var(--muted)}

/* -- Tabs -- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:10px 20px;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:color .12s,border-color .12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}

/* -- Accordion -- */
.accordion{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.acc-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface-alt);cursor:pointer;user-select:none;gap:12px;transition:background .12s}
.acc-header:hover{background:rgba(255,255,255,.03)}
.acc-title{font-weight:600;font-size:.95rem;flex:1}
.acc-chips{display:flex;gap:6px;flex-wrap:wrap}
.acc-chip{padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:500}
.acc-chip.pri-high{background:var(--danger-dim);color:var(--danger)}
.acc-chip.pri-medium{background:var(--yellow-dim);color:var(--yellow)}
.acc-chip.pri-low{background:var(--green-dim);color:var(--green)}
.acc-chip.component{background:var(--purple-dim);color:var(--purple)}
.acc-chip.estimate{background:var(--accent-dim);color:var(--accent)}
.acc-chip.date{background:rgba(255,255,255,.06);color:var(--muted)}
.acc-chip.points{background:var(--green-dim);color:var(--green);font-weight:700}
.acc-arrow{color:var(--muted);transition:transform .2s}
.acc-body{display:none;padding:14px 16px;border-top:1px solid var(--border);background:var(--bg);font-size:.9rem;line-height:1.6;color:var(--muted)}
.acc-body.open{display:block}
.acc-body p{margin-bottom:8px}
.acc-body .sub-title{font-weight:600;color:var(--text);margin-top:12px;margin-bottom:4px;font-size:.85rem}
.acc-body ul{padding-left:18px;margin-bottom:8px}
.acc-body li{margin-bottom:4px}

/* nested cards for stories/subtasks */
.nested-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:6px;margin-bottom:6px}
.nested-card strong{font-size:.88rem;color:var(--text)}
.nested-card .desc{color:var(--muted);font-size:.85rem;margin-top:4px}
.nested-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* -- Buttons -- */
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;font-size:.85rem;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-alt);border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#4090e8}
.btn-danger{border-color:rgba(248,81,73,.4);color:var(--danger)}
.btn-danger:hover{background:var(--danger-dim)}

/* -- Toast -- */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:.88rem;font-weight:500;color:#fff;animation:toastIn .3s ease;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.success{background:#238636}
.toast.error{background:#da3633}
.toast.info{background:#1f6feb}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* -- Loading bar -- */
.loading-bar{height:3px;background:var(--accent);position:fixed;top:0;left:0;z-index:9999;width:0;transition:width .3s;border-radius:0 2px 2px 0}
.loading-bar.active{animation:loadPulse 2s ease-in-out infinite}
@keyframes loadPulse{0%{width:10%}50%{width:70%}100%{width:90%}}

/* -- XML editor -- */
.xml-editor{margin-top:16px}
.xml-editor textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:var(--radius);font-family:"JetBrains Mono",Consolas,monospace;font-size:.82rem;line-height:1.5;resize:vertical}
.xml-editor textarea:focus{outline:none;border-color:var(--accent)}

@media(max-width:768px){body{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>
<div class="toast-container" id="toasts"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-header">
        <h1><span>&#9889;</span>AI Project Planner</h1>
    </div>
    <button class="btn-new" id="btnNewProject">+ Novy projekt</button>
    <div class="sidebar-list" id="sidebarList"></div>
</aside>

<!-- MAIN -->
<div class="main">
    <div class="create-panel" id="createPanel">
        <h2>&#10024; Novy projekt</h2>
        <form id="projectForm" class="form-grid">
            <div class="form-field">
                <label>Nazov projektu</label>
                <input id="projectName" type="text" placeholder="Napr. Inteligentne planovanie rozpoctu" required>
            </div>
            <div class="form-field">
                <label>Popis projektu</label>
                <textarea id="projectDescription" placeholder="Strucne popis ciele, prinosy a ocakavane deliverables projektu." required rows="3"></textarea>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>Datum zaciatku</label>
                    <input id="startDate" type="date">
                </div>
                <div class="form-field">
                    <label>Deadline</label>
                    <input id="deadline" type="date">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>Rozpocet (EUR)</label>
                    <input id="budget" type="number" min="0" step="100" placeholder="napr. 50000">
                </div>
                <div class="form-field">
                    <label>Velkost timu</label>
                    <input id="teamSize" type="number" min="1" max="50" placeholder="napr. 5">
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="toggleCreate(false)">Zrusit</button>
                <button type="submit" class="btn btn-primary">Vygenerovat plan</button>
            </div>
        </form>
    </div>

    <div class="detail-panel" id="detailPanel">
        <div class="detail-empty" id="detailEmpty">Vyber projekt zo zoznamu alebo vytvor novy.</div>
        <div id="detailContent" style="display:none"></div>
    </div>
</div>

<script>
// ===== STATE =====
const jiraExports = JSON.parse(localStorage.getItem('jiraExports') || '{}');
const state = { projects: [], activeId: null };

// ===== INIT =====
document.getElementById('projectForm').addEventListener('submit', onSubmit);
document.getElementById('btnNewProject').addEventListener('click', () => toggleCreate(true));
loadProjects();

// ===== TOAST =====
function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

// ===== LOADING =====
function setLoading(flag) {
    document.getElementById('loadingBar').classList.toggle('active', flag);
}

// ===== CREATE PANEL =====
function toggleCreate(show) {
    document.getElementById('createPanel').classList.toggle('active', show);
    if (show) document.getElementById('projectName').focus();
}

// ===== SUBMIT =====
async function onSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('projectName').value.trim();
    const description = document.getElementById('projectDescription').value.trim();
    if (!name || !description) return;
    const startDate = document.getElementById('startDate').value || '';
    const deadline = document.getElementById('deadline').value || '';
    const budget = document.getElementById('budget').value || '';
    const teamSize = document.getElementById('teamSize').value || '';
    setLoading(true);
    try {
        const r = await fetch('/api/generate', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name,description,startDate,deadline,budget,teamSize})
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        toggleCreate(false);
        e.target.reset();
        await loadProjects();
        if (data.xml) {
            toast('Plan bol uspesne vygenerovany!', 'success');
            // select last created
            if (state.projects.length) selectProject(state.projects[0].id);
        } else {
            toast('AI nevratil odpoved. Skontroluj logy.', 'error');
        }
    } catch (err) {
        console.error(err);
        toast('Chyba pri generovani planu: ' + err.message, 'error');
    } finally {
        setLoading(false);
    }
}

// ===== PROJECTS =====
async function loadProjects() {
    try {
        const r = await fetch('/api/projects');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        state.projects = await r.json();
        renderSidebar();
        if (state.activeId) renderDetail(state.activeId);
    } catch (err) {
        console.error(err);
    }
}

function renderSidebar() {
    const el = document.getElementById('sidebarList');
    if (!state.projects.length) {
        el.innerHTML = '<div class="sidebar-empty">Ziadne projekty.</div>';
        return;
    }
    el.innerHTML = state.projects.map(p => `
        <div class="sidebar-item ${p.id === state.activeId ? 'active' : ''}" data-id="${p.id}">
            <span class="name">${esc(p.name)}</span>
            <span class="date">#${p.id}</span>
        </div>
    `).join('');
    el.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', () => selectProject(+item.dataset.id));
    });
}

function selectProject(id) {
    state.activeId = id;
    renderSidebar();
    renderDetail(id);
}

// ===== DETAIL =====
function renderDetail(id) {
    const project = state.projects.find(p => p.id === id);
    const empty = document.getElementById('detailEmpty');
    const content = document.getElementById('detailContent');
    if (!project) { empty.style.display = 'flex'; content.style.display = 'none'; return; }
    empty.style.display = 'none';
    content.style.display = 'block';

    const parsed = parseXml(project.xmlContent);
    const meta = [];
    if (project.startDate) meta.push('Zaciatok: ' + project.startDate);
    if (project.deadline) meta.push('Deadline: ' + project.deadline);
    if (project.budget) meta.push('Rozpocet: ' + project.budget + ' EUR');
    if (project.teamSize) meta.push('Tim: ' + project.teamSize);

    content.innerHTML = `
        <div class="detail-header">
            <div>
                <h2>${esc(project.name)}</h2>
                <p style="color:var(--muted);margin-top:4px;font-size:.9rem">${esc(project.description || '')}</p>
                ${meta.length ? '<div class="detail-meta" style="margin-top:8px">' + meta.map(m => '<span class="meta-chip">' + esc(m) + '</span>').join('') + '</div>' : ''}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn" onclick="exportProject(${id},'PRINCE2')">Export PRINCE2</button>
                <button class="btn" onclick="exportProject(${id},'Scrum')">Export Scrum</button>
                <button class="btn btn-danger" onclick="deleteProject(${id})">Odstranit</button>
            </div>
        </div>
        ${buildJiraLinks(id)}
        <div class="tabs">
            <div class="tab active" data-tab="prince2">PRINCE2</div>
            <div class="tab" data-tab="scrum">Scrum</div>
            <div class="tab" data-tab="xml">XML</div>
        </div>
        <div class="tab-content active" data-panel="prince2">${renderPrince2(parsed.prince2)}</div>
        <div class="tab-content" data-panel="scrum">${renderScrum(parsed.scrum)}</div>
        <div class="tab-content" data-panel="xml">
            <div class="xml-editor">
                <textarea id="xmlEditor">${esc(project.xmlContent||'')}</textarea>
                <div style="margin-top:8px;display:flex;gap:8px">
                    <button class="btn" onclick="saveXml(${id})">Ulozit XML</button>
                </div>
            </div>
        </div>
    `;
    content.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            content.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            content.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            content.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
        });
    });
    // Accordion toggling
    content.querySelectorAll('.acc-header').forEach(h => {
        h.addEventListener('click', () => {
            const body = h.nextElementSibling;
            body.classList.toggle('open');
            h.querySelector('.acc-arrow').textContent = body.classList.contains('open') ? '\u25B2' : '\u25BC';
        });
    });
}

// ===== PRINCE2 RENDER =====
function renderPrince2(node) {
    if (!node) return '<p style="color:var(--muted);padding:16px">PRINCE2 plan nebol najdeny v XML.</p>';
    const stages = Array.from(node.querySelectorAll('Stages > Stage'));
    return stages.map((s, i) => {
        const name = txt(s,'Name') || 'Stage ' + (i+1);
        const desc = txt(s,'Description');
        const chips = buildChips(s, ['Priority','Component','OriginalEstimate','DueDate']);
        const outputs = listItems(s, 'Outputs', 'Output');
        const risks = listItems(s, 'Risks', 'Risk');
        const tasks = Array.from(s.querySelectorAll('Tasks > Task'));
        return `<div class="accordion">
            <div class="acc-header">
                <span class="acc-title">${esc(name)}</span>
                <div class="acc-chips">${chips}</div>
                <span class="acc-arrow">\u25BC</span>
            </div>
            <div class="acc-body">
                ${desc ? '<p>'+esc(desc)+'</p>' : ''}
                ${outputs.length ? '<p class="sub-title">Vystupy</p><ul>'+outputs.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul>' : ''}
                ${risks.length ? '<p class="sub-title">Rizika</p><ul>'+risks.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>' : ''}
                ${tasks.length ? '<p class="sub-title">Ulohy (sub-tasky)</p>'+tasks.map(t => renderTaskCard(t)).join('') : ''}
            </div>
        </div>`;
    }).join('');
}

// ===== SCRUM RENDER =====
function renderScrum(node) {
    if (!node) return '<p style="color:var(--muted);padding:16px">Scrum plan nebol najdeny v XML.</p>';
    const sprints = Array.from(node.querySelectorAll('Sprints > Sprint'));
    return sprints.map((sp, i) => {
        const name = txt(sp,'Name') || 'Sprint ' + (i+1);
        const goal = txt(sp,'Goal');
        const desc = txt(sp,'Description');
        const chips = buildChips(sp, ['Priority','DueDate']);
        const risks = listItems(sp, 'Risks', 'Risk');
        const epics = Array.from(sp.querySelectorAll('Epics > Epic'));
        return `<div class="accordion">
            <div class="acc-header">
                <span class="acc-title">${esc(name)}</span>
                <div class="acc-chips">${chips}</div>
                <span class="acc-arrow">\u25BC</span>
            </div>
            <div class="acc-body">
                ${goal ? '<p><strong>Ciel:</strong> '+esc(goal)+'</p>' : ''}
                ${desc ? '<p>'+esc(desc)+'</p>' : ''}
                ${risks.length ? '<p class="sub-title">Rizika</p><ul>'+risks.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>' : ''}
                ${epics.map(ep => renderEpic(ep)).join('')}
            </div>
        </div>`;
    }).join('');
}

function renderEpic(epic) {
    const title = txt(epic,'Title') || 'Epic';
    const desc = txt(epic,'Description');
    const chips = buildChips(epic, ['Priority','Component']);
    const labels = txt(epic,'Labels');
    const stories = Array.from(epic.querySelectorAll('Stories > Story'));
    return `<div class="nested-card">
        <strong>${esc(title)}</strong>
        <div class="nested-chips">${chips}${labels ? labelsChips(labels) : ''}</div>
        ${desc ? '<div class="desc">'+esc(desc)+'</div>' : ''}
        ${stories.map(st => renderStory(st)).join('')}
    </div>`;
}

function renderStory(story) {
    const title = txt(story,'Title') || 'Story';
    const desc = txt(story,'Description');
    const chips = buildChips(story, ['StoryPoints','Priority','OriginalEstimate','DueDate']);
    const labels = txt(story,'Labels');
    const criteria = listItems(story, 'AcceptanceCriteria', 'Criterion');
    const subtasks = Array.from(story.querySelectorAll('SubTasks > Task'));
    return `<div class="nested-card" style="margin-left:8px;border-style:dashed">
        <strong>${esc(title)}</strong>
        <div class="nested-chips">${chips}${labels ? labelsChips(labels) : ''}</div>
        ${desc ? '<div class="desc">'+esc(desc)+'</div>' : ''}
        ${criteria.length ? '<p class="sub-title" style="font-size:.82rem;margin-top:8px">Akceptacne kriteria</p><ul style="font-size:.82rem">'+criteria.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>' : ''}
        ${subtasks.length ? '<p class="sub-title" style="font-size:.82rem;margin-top:8px">Sub-tasky</p>'+subtasks.map(t=>renderTaskCard(t)).join('') : ''}
    </div>`;
}

function renderTaskCard(task) {
    const title = txt(task,'Title') || txt(task,'Description') || 'Task';
    const desc = txt(task,'Description');
    const chips = buildChips(task, ['Priority','OriginalEstimate','DueDate']);
    return `<div class="nested-card" style="background:var(--surface-alt);border-color:var(--border)">
        <strong style="font-size:.84rem">${esc(title)}</strong>
        <div class="nested-chips">${chips}</div>
        ${desc && desc !== title ? '<div class="desc" style="font-size:.82rem">'+esc(desc)+'</div>' : ''}
    </div>`;
}

// ===== HELPERS =====
function buildChips(node, fields) {
    return fields.map(f => {
        const v = txt(node, f);
        if (!v) return '';
        if (f === 'Priority') return `<span class="acc-chip pri-${v.toLowerCase()}">${esc(v)}</span>`;
        if (f === 'Component') return `<span class="acc-chip component">${esc(v)}</span>`;
        if (f === 'OriginalEstimate') return `<span class="acc-chip estimate">${esc(v)}</span>`;
        if (f === 'StoryPoints') return `<span class="acc-chip points">${esc(v)} SP</span>`;
        if (f === 'DueDate') return `<span class="acc-chip date">${esc(v)}</span>`;
        return `<span class="acc-chip" style="background:rgba(255,255,255,.06);color:var(--muted)">${esc(v)}</span>`;
    }).join('');
}

function labelsChips(str) {
    return str.split(',').map(l => l.trim()).filter(Boolean).map(l =>
        `<span class="acc-chip" style="background:rgba(255,255,255,.05);color:var(--muted);font-size:.7rem">#${esc(l)}</span>`
    ).join('');
}

function listItems(node, wrapper, item) {
    const w = node.querySelector(wrapper);
    if (!w) return [];
    return Array.from(w.querySelectorAll(item)).map(el => el.textContent.trim()).filter(Boolean);
}

function txt(node, tag) { const el = node ? node.querySelector(tag) : null; return el ? el.textContent.trim() : ''; }

function parseXml(xmlContent) {
    if (!xmlContent) return {prince2:null,scrum:null};
    let c = xmlContent.trim();
    const lo = c.toLowerCase();
    const s = lo.indexOf('<projectplans>');
    const e = lo.lastIndexOf('</projectplans>');
    if (s !== -1 && e !== -1) c = c.slice(s, e + '</projectplans>'.length);
    const doc = new DOMParser().parseFromString(c, 'text/xml');
    if (doc.querySelector('parsererror')) return {prince2:null,scrum:null};
    return { prince2: doc.querySelector('PRINCE2Project'), scrum: doc.querySelector('ScrumProject') };
}

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildJiraLinks(projectId) {
    const links = jiraExports[projectId];
    if (!links) return '';
    const parts = [];
    if (links.prince2) parts.push(`<a href="${links.prince2.url}" target="_blank" class="btn" style="text-decoration:none">PRINCE2: ${links.prince2.key}</a>`);
    if (links.scrum) parts.push(`<a href="${links.scrum.url}" target="_blank" class="btn" style="text-decoration:none">Scrum: ${links.scrum.key}</a>`);
    return parts.length ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + parts.join('') + '</div>' : '';
}

// ===== ACTIONS =====
async function deleteProject(id) {
    if (!confirm('Naozaj chces zmazat tento projekt?')) return;
    try {
        await fetch('/api/projects/' + id, {method:'DELETE'});
        delete jiraExports[id];
        localStorage.setItem('jiraExports', JSON.stringify(jiraExports));
        state.activeId = null;
        await loadProjects();
        document.getElementById('detailContent').style.display = 'none';
        document.getElementById('detailEmpty').style.display = 'flex';
        toast('Projekt bol zmazany.', 'success');
    } catch (err) {
        toast('Nepodarilo sa zmazat projekt.', 'error');
    }
}

async function exportProject(id, methodology) {
    const project = state.projects.find(p => p.id === id);
    if (!project) return;
    setLoading(true);
    try {
        const r = await fetch('/api/projects/' + id + '/export-to-jira', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({methodology, projectName: project.name})
        });
        const result = await r.json();
        if (result.success) {
            if (!jiraExports[id]) jiraExports[id] = {};
            jiraExports[id][methodology.toLowerCase()] = {key: result.projectKey, url: result.projectUrl};
            localStorage.setItem('jiraExports', JSON.stringify(jiraExports));
            toast('Export uspesny! Vytvorenych ' + result.issues.length + ' poloziek v Jira.', 'success');
            renderDetail(id);
        } else {
            toast('Export zlyhal: ' + result.message, 'error');
        }
    } catch (err) {
        toast('Export sa nepodaril: ' + err.message, 'error');
    } finally {
        setLoading(false);
    }
}

async function saveXml(id) {
    const project = state.projects.find(p => p.id === id);
    if (!project) return;
    const xml = document.getElementById('xmlEditor').value.trim();
    if (!xml) return;
    try {
        const r = await fetch('/api/projects/' + id, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name: project.name, description: project.description, xmlContent: xml})
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        await loadProjects();
        toast('XML bolo ulozene.', 'success');
    } catch (err) {
        toast('Nepodarilo sa ulozit XML: ' + err.message, 'error');
    }
}
